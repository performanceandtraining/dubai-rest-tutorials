.header-tools{display:flex;align-items:center;gap:20px;flex-shrink:0}.fullscreen-toggle{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:39px;padding:9px 12px;border:1px solid #a9d9fc;background:#eaf5ff;color:#125082;border-radius:5px;font-size:11px;font-weight:650}.fullscreen-toggle:hover,.fullscreen-toggle[aria-pressed=true]{background:#4baaf4;color:#102b4e}.fullscreen-toggle:disabled{opacity:.6}.expanded-view .site-header,.expanded-view .player{max-width:none}.expanded-view .device{width:min(100%,620px)}

(()=>{
"use strict";
function createState(steps,index=0){
  const valid=Number.isInteger(index)&&index>=0&&index<steps.length;
  return {steps,index:valid?index:0,hint:false,status:'idle',fieldErrors:{},completed:false,entries:{}};
}
const normal=s=>String(s??'').trim().toLocaleLowerCase();
function respond(state,response={}){
  if(state.completed)return state;
  const step=state.steps[state.index];let correct=false;const fieldErrors={};
  if(['input','select'].includes(step.type)){
    for(const f of step.fields){
      const value=response.values?.[f.name];
      if(!normal(value))fieldErrors[f.name]=`Enter ${f.label.toLowerCase()}.`;
      else if(normal(value)!==normal(f.expected))fieldErrors[f.name]=`Use the practice ${f.label.toLowerCase()} shown in the instruction.`;
    }
    correct=Object.keys(fieldErrors).length===0;
  }else if(step.type==='scroll')correct=response.action==='scroll';
  else if(step.type==='read')correct=true;
  else correct=step.targets.some(t=>t.name===response.target);
  return {...state,status:correct?'correct':'incorrect',fieldErrors};
}
function navigate(state,direction){
  if(direction<0){
    return {...state,index:state.completed?state.steps.length-1:Math.max(0,state.index-1),completed:false,hint:false,status:'idle',fieldErrors:{}};
  }
  if(state.completed)return state;
  if(state.steps[state.index].type!=='read'&&state.status!=='correct')return state;
  if(state.index===state.steps.length-1)return {...state,completed:true,hint:false};
  return {...state,index:state.index+1,hint:false,status:'idle',fieldErrors:{}};
}
function toggleHint(state){return {...state,hint:!state.hint};}
function restart(state){return createState(state.steps);}
function readProgress(storage,key){
  try{
    const data=JSON.parse(storage?.getItem(key)??'null');
    if(!data||!Number.isInteger(data.index)||data.index<0)return null;
    const source=data.entries&&typeof data.entries==='object'?data.entries:{};
    const valid=Object.entries(source).filter(([,f])=>f&&typeof f==='object'&&typeof f.name==='string'&&typeof f.label==='string'&&typeof f.value==='string'&&Array.isArray(f.rect)&&f.rect.length===4&&f.rect.every(Number.isFinite)&&f.rect[0]>=0&&f.rect[1]>=0&&f.rect[2]>0&&f.rect[3]>0);
    return {...data,entries:Object.fromEntries(valid)};
  }catch{return null;}
}
function saveProgress(storage,key,state){
  try{storage?.setItem(key,JSON.stringify({index:state.index,completed:state.completed,version:1,entries:state.entries??{}}));}catch{/* Progress is optional when browser storage is unavailable. */}
}

const topics=window.DUBAI_TOPICS??[];
const main=document.getElementById('main');
const query=new URLSearchParams(location.search);
const selectedId=query.get('view')==='topics'?null:(query.get('topic')||window.DUBAI_DEFAULT_TOPIC);
const topic=topics.find(t=>t.id===selectedId);
let state=null,steps=[],activeValues={},sectionKey='',screenScroll=null,fitObserver=null;
const storage=(()=>{try{return window.localStorage;}catch{return null;}})();
const key=topic?'dubai-rest-tutorial:v4:'+topic.id:'';
const imageSrc=name=>window.DUBAI_IMAGES?.[name]??name;
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const locate=(node,rect,step)=>{const[x,y,w,h]=rect;Object.assign(node.style,{left:x/step.imageWidth*100+'%',top:y/step.imageHeight*100+'%',width:w/step.imageWidth*100+'%',height:h/step.imageHeight*100+'%'});};
const button=(label,cls,handler)=>{const b=document.createElement('button');b.type='button';b.className=cls;b.textContent=label;b.addEventListener('click',handler);return b;};
const entryKey=(s,shot,name)=>s.sectionId+':'+shot+':'+name;
function remember(){saveProgress(storage,key,state);}

function renderHub(){
  fitObserver?.disconnect();document.body.classList.remove('activity-open','compact-screen');
  document.title='Dubai REST · Practice topics';
  main.innerHTML=`<section class="hub"><div class="eyebrow">Learn by doing</div><h1>Practise Dubai REST.</h1><p class="hub-intro">Explore the app one task at a time. Read the instruction, try the action on the screen, and use a hint whenever you need one.</p><div class="hub-how"><span><b>1</b>Choose a topic</span><span><b>2</b>Try each action</span><span><b>3</b>Use Hint if needed</span></div><div class="topic-grid"></div></section>`;
  const grid=main.querySelector('.topic-grid');
  for(const t of topics){
    const progress=readProgress(storage,'dubai-rest-tutorial:v4:'+t.id);const count=t.sections.reduce((n,s)=>n+s.steps.length,0);
    const card=document.createElement('a');card.className='topic-card';card.href='?topic='+t.id;
    card.innerHTML=`<div class="topic-top"><span class="topic-number">TOPIC ${String(t.number).padStart(2,'0')}</span>${progress?`<span class="topic-tag">${progress.completed?'Completed':'In progress'}</span>`:''}</div><h2>${e(t.title)}</h2><p>${e(t.description)}</p><div class="topic-meta"><span>${t.sections.length} ${t.sections.length===1?'section':'sections'} · ${count} steps</span><span class="topic-arrow" aria-hidden="true">↗</span></div>`;
    grid.append(card);
  }
}
function startTopic(){
  steps=topic.sections.flatMap((s,i)=>s.steps.map(x=>({...x,sectionId:s.id,sectionIndex:i+1})));
  const saved=readProgress(storage,key);state=createState(steps,saved?.index??0);
  if(saved?.version===1&&saved.index<steps.length){state.completed=saved.completed===true;state.entries=saved.entries&&typeof saved.entries==='object'?saved.entries:{};}
  document.title=topic.title+' · Dubai REST practice';renderStep(false);
}
function renderStep(focus=true,reviewScreen=false){
  if(state.completed){renderCompletion();return;}
  fitObserver?.disconnect();document.body.classList.add('activity-open');
  const s=steps[state.index];sectionKey=s.sectionId;const info=s.type==='read'&&!s.observation&&!reviewScreen;
  activeValues={};for(const f of s.fields)activeValues[f.name]=state.entries[entryKey(s,s.shot,f.name)]?.value??'';
  const percent=Math.round(state.index/steps.length*100);
  const section=`<div class="section-label">${s.sectionIndex} / ${topic.sections.length} · ${e(s.sectionTitle)}</div>`;
  const nav=`<div class="step-nav"><button type="button" class="button secondary" id="previous" ${state.index===0?'disabled':''}>Back</button><button type="button" class="button primary" id="continue" ${!info?'disabled':''}>Continue <span aria-hidden="true">&nbsp;→</span></button></div>`;
  const note=s.explanation?`<p class="instruction-note">${e(s.explanation)}</p>`:'';
  const feedback='<div id="feedback" role="status" aria-live="polite" aria-atomic="true"></div>';
  const infoCard=info?`<div class="info-layer"><section class="info-dialog" role="dialog" aria-modal="false" aria-labelledby="instruction"><span class="state-label info-label">Information</span>${section}<h2 id="instruction" tabindex="-1">${e(s.instruction)}</h2>${note}<button type="button" class="button secondary view-screen-button" id="view-screen">View screen</button>${feedback}${nav}<p class="mode-explanation">Read this information, then choose Continue. No action is needed on the app screen yet.</p></section></div>`:'';
  const action=info?'':`<section class="action-banner" aria-labelledby="instruction"><div class="action-main"><div class="action-heading"><span class="state-label ${s.type==='read'?'info-label':''}">${s.observation?'Already selected':s.type==='read'?'Information':'Your turn'}</span>${section}<h2 id="instruction" tabindex="-1">${e(s.instruction)}</h2><p class="action-prompt">${s.observation?'No click is needed. Choose Continue.':s.type==='read'?'Review the app screen, then choose Continue.':s.type==='scroll'?'Scroll inside the app list.':s.fields.length?'Complete the field on the app screen, then choose Check entry.':'Click the control on the app screen.'}</p>${note}${s.practice?`<div class="practice-details"><strong>Practice details</strong><span>${e(s.practice)}</span><small>Sample data only${s.type==='select'?' · practice choices':''}</small></div>`:''}</div><div class="action-tools">${s.observation?'':'<button type="button" class="hint-button" id="hint"><span class="hint-symbol" aria-hidden="true">?</span><span>Hint</span></button>'}${s.type==='read'&&!s.observation?'<button type="button" class="button secondary" id="show-information">Show information</button>':''}${s.fields.length?'<button type="button" class="button primary input-submit" id="check-entry">Check entry</button>':''}${nav}</div></div><p class="hint-text" id="hint-text" hidden></p>${feedback}</section>`;
  main.innerHTML=`<section class="player ${info?'information-mode':s.type==='read'?'review-mode':'action-mode'}"><aside class="tutorial-sidebar"><div class="player-top"><div><a class="back-link" href="?view=topics">← ${topics.length===1?'Topic overview':'All topics'}</a><h1>${e(topic.title)}</h1></div><button type="button" class="restart" id="restart">Restart topic</button></div><div class="progress-meta"><span>STEP ${state.index+1} OF ${steps.length}</span><span>${percent}% complete</span></div><div class="progress-track" role="progressbar" aria-label="Topic progress" aria-valuemin="0" aria-valuemax="${steps.length}" aria-valuenow="${state.index}"><div class="progress-fill" style="width:${percent}%"></div></div>${action}${info?'<div class="reading-note">Read the information on the app screen. Choose View screen to inspect it, or Continue to move on.</div>':''}</aside><div class="screen-stage"><div class="screen-column"><div class="view-label">Dubai REST · ${info?'read the information overlay':s.observation?'notice the highlighted settings':'clickable practice screen'}</div><div class="screen-space" id="screen-space"><div class="device ${s.type==='scroll'?'screen-scroll':''}" id="device"><div class="app-screen" id="app-screen"></div></div></div><div class="screen-utilities"><p class="practice-badge">${s.type==='select'?'The editable field contains practice choices.':'Simulated screen · no live account or service connection'}</p></div><div id="screen-extra"></div></div>${infoCard}</div></section>`;
  const screen=document.getElementById('app-screen');renderScreen(screen,s,s.shot,true);screen.inert=info;
  document.getElementById('restart').addEventListener('click',()=>{state=restart(state);remember();renderStep();});
  document.getElementById('previous').addEventListener('click',()=>{state=navigate(state,-1);remember();renderStep();});
  document.getElementById('continue').addEventListener('click',()=>{const next=navigate(state,1);if(next.index===state.index&&!next.completed)return;state=next;remember();renderStep();});
  document.getElementById('hint')?.addEventListener('click',()=>{state=toggleHint(state);renderHint();});
  document.getElementById('view-screen')?.addEventListener('click',()=>renderStep(true,true));
  document.getElementById('show-information')?.addEventListener('click',()=>renderStep(true,false));
  document.getElementById('check-entry')?.addEventListener('click',()=>answer({values:activeValues}));
  screen.addEventListener('click',event=>{if(event.target===screen||event.target.classList.contains('app-image')){if(s.type!=='read')answer({target:'background'});}});
  if(s.type==='scroll'){
    const viewport=document.getElementById('device');screenScroll=viewport;
    viewport.tabIndex=0;viewport.setAttribute('aria-label','Scrollable app services list');
    viewport.addEventListener('scroll',()=>{if(viewport.scrollTop>65&&state.status!=='correct')answer({action:'scroll'});});
    const scroll=button('Scroll down inside the app','button secondary scroll-tool',()=>{viewport.scrollBy({top:Math.min(260,viewport.scrollHeight),behavior:'instant'});if(viewport.scrollTop>65)answer({action:'scroll'});});
    document.querySelector('.screen-utilities').prepend(scroll);
  }
  renderFeedback();renderHint();
  const fit=()=>fitScreen(s);fitObserver=new ResizeObserver(fit);fitObserver.observe(document.getElementById('screen-space'));fit();document.fonts.ready.then(fit);
  if(focus){document.getElementById('instruction').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
}
function renderScreen(screen,s,shot,interactive){
  screen.replaceChildren();const img=document.createElement('img');img.src=imageSrc(`assets/screenshot-${String(shot).padStart(2,'0')}.png`);img.alt=s.sectionTitle+' app screen';img.className='app-image';img.width=s.imageWidth;img.height=s.imageHeight;screen.append(img);
  if(shot===5)renderServiceCard(screen);
  if(shot!==s.shot)return;
  const active=new Set(s.fields.map(f=>f.name));
  for(const [k,entry] of Object.entries(state.entries)){
    if(!k.startsWith(s.sectionId+':'+shot+':')||active.has(entry.name)||!Array.isArray(entry.rect))continue;
    const overlay=document.createElement('div');overlay.className='saved-field';locate(overlay,entry.rect,s);
    overlay.innerHTML=`<span class="field-label">${e(entry.label)}</span><span class="field-value">${e(entry.value)}</span>`;screen.append(overlay);
  }
  if(!interactive)return;
  if(['input','select'].includes(s.type)){
    for(const f of s.fields){
      const wrap=document.createElement('div');wrap.className='field-overlay';wrap.dataset.field=f.name;locate(wrap,f.rect,s);const id='field-'+f.name;
      const label=document.createElement('label');label.htmlFor=id;label.textContent=f.label;wrap.append(label);
      let input;
      if(f.widget==='select'){
        input=document.createElement('select');const blank=new Option('Choose…','');input.append(blank);for(const option of f.options)input.append(new Option(option,option));
      }else{input=document.createElement('input');input.type=f.widget==='date'?'date':'text';if(f.widget==='number')input.inputMode='numeric';input.autocomplete='off';input.spellcheck=false;}
      input.id=id;input.name=f.name;input.value=activeValues[f.name]??'';input.setAttribute('aria-describedby','practice-field-help');
      input.addEventListener('input',()=>{activeValues[f.name]=input.value;const mirror=wrap.querySelector('.field-tap');if(mirror)mirror.textContent=input.value||'Enter…';if(state.status!=='idle'){state={...state,status:'idle',fieldErrors:{}};renderFeedback();}});
      input.addEventListener('change',()=>{activeValues[f.name]=input.value;const mirror=wrap.querySelector('.field-tap');if(mirror)mirror.textContent=input.value||'Choose…';});
      input.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();answer({values:activeValues});}});
      wrap.append(input);screen.append(wrap);
    }
    const help=document.createElement('span');help.id='practice-field-help';help.className='sr-only';help.textContent='Enter or choose the sample value in Practice details, then choose Check entry.';screen.append(help);
  }else if(s.type==='click'){
    for(const t of s.targets){const b=button(t.label,'hotspot',()=>answer({target:t.name}));b.setAttribute('aria-label',t.label);b.textContent='';locate(b,t.rect,s);screen.append(b);}
  }
}
function renderServiceCard(screen){
  const rows=[
    {label:'Service Description',closed:[93,46],open:[92,57],text:'This service allows customers to verify the validity of the Certificate of Title / Title deed issued by the Land Department.'},
    {label:'Service Procedures',closed:[145,45],open:[155,67],text:'Via website or app. Step I: Log in to the website or the app and select the service. Step II: View the required information that appears before it.'},
    {label:'Service Channels',closed:[197,45],open:[229,55],text:'Land Department website; Dubai REST App.'},
    {label:'Service Time',closed:[248,45],open:[290,56],text:'Immediate'}
  ];
  const group=document.createElement('div');group.className='service-accordions';
  for(const [i,row] of rows.entries()){
    const b=button('','service-card-row',()=>update(b.getAttribute('aria-expanded')!=='true'));
    b.id='service-tab-'+i;b.setAttribute('aria-label',row.label);b.setAttribute('aria-controls','service-panel-'+i);
    const picture=document.createElement('img');picture.className='service-panel-image';picture.alt='';picture.setAttribute('aria-hidden','true');b.append(picture);
    const content=document.createElement('span');content.id='service-panel-'+i;content.className='sr-only';content.setAttribute('role','region');content.setAttribute('aria-label',row.label);content.textContent=row.text;b.append(content);
    function update(open){
      const [y,h]=open?row.open:row.closed;const sourceWidth=open?554:556;
      b.setAttribute('aria-expanded',String(open));content.hidden=!open;
      b.style.aspectRatio=sourceWidth+'/'+h;
      picture.src=imageSrc(open?'assets/screenshot-40.png':'assets/screenshot-05.png');
      picture.style.transform='translateY(-'+y/994*100+'%)';
    }
    update(false);group.append(b);
  }
  screen.append(group);
}

function answer(response){
  if(state.status==='correct')return;
  const s=steps[state.index];state=respond(state,response);
  if(state.status==='correct'){
    state.hint=false;
    for(const f of s.fields)state.entries={...state.entries,[entryKey(s,s.shot,f.name)]:{name:f.name,label:f.label,value:activeValues[f.name],rect:f.rect}};
    if(s.afterShot)renderScreen(document.getElementById('app-screen'),s,s.afterShot,false);
    if(s.zoomRegion)showZoom(s);
    document.querySelectorAll('.hotspot').forEach(b=>b.disabled=true);
    remember();
  }
  renderFeedback();renderHint();
  const feedback=document.getElementById('feedback');
  feedback.tabIndex=-1;feedback.focus({preventScroll:true});feedback.scrollIntoView({block:'nearest',behavior:'instant'});
}
function renderFeedback(){
  const s=steps[state.index];const box=document.getElementById('feedback');const next=document.getElementById('continue');next.disabled=s.type!=='read'&&state.status!=='correct';
  const check=document.getElementById('check-entry');if(check)check.disabled=state.status==='correct';
  if(state.status==='idle'){box.innerHTML='';}
  else if(state.status==='correct')box.innerHTML=`<div class="feedback correct"><strong>Correct.</strong> ${e(s.success.replace(/^Correct\.\s*/,''))}</div>`;
  else box.innerHTML=`<div class="feedback incorrect"><strong>Incorrect.</strong> ${s.fields.length?'Check the practice details and try again.':'Try again. Follow the instruction, or use Hint for help.'}${Object.keys(state.fieldErrors).length?'<ul class="field-errors">'+Object.values(state.fieldErrors).map(v=>'<li>'+e(v)+'</li>').join('')+'</ul>':''}</div>`;
  for(const f of s.fields){const input=document.getElementById('field-'+f.name);if(input)input.setAttribute('aria-invalid',state.fieldErrors[f.name]?'true':'false');}
  if(state.status==='correct')showContinueOverlay(box,next);
}
function showContinueOverlay(feedback,next){
  if(document.getElementById('continue-overlay'))return;
  const overlay=document.createElement('dialog');overlay.id='continue-overlay';overlay.className='success-dialog';
  overlay.setAttribute('aria-labelledby','success-heading');overlay.setAttribute('aria-describedby','success-instruction');
  overlay.innerHTML='<span class="state-label">Step complete</span><h2 id="success-heading">Action complete</h2><p id="success-instruction">Choose Continue to move to the next step.</p>';
  const photo=document.querySelector('#screen-extra .zoom');if(photo)overlay.append(photo);
  overlay.append(feedback,next);document.querySelector('.player').append(overlay);
  overlay.addEventListener('cancel',event=>event.preventDefault());overlay.showModal();
}

function highlightTargets(s){
  const screen=document.getElementById('app-screen');screen.querySelectorAll('.hint-mark').forEach(x=>x.remove());
  for(const t of s.targets){const mark=document.createElement('div');mark.className='hint-mark';mark.setAttribute('aria-hidden','true');locate(mark,t.rect,s);screen.append(mark);}
}
function renderHint(){
  const s=steps[state.index];if(s.observation){highlightTargets(s);return;}const b=document.getElementById('hint');const text=document.getElementById('hint-text');if(!b)return;
  const open=state.hint&&state.status!=='correct';b.classList.toggle('is-open',open);b.setAttribute('aria-expanded',String(open));b.setAttribute('aria-controls','hint-text');b.disabled=state.status==='correct';b.querySelector('span:last-child').textContent=open?'Hide hint':'Hint';text.hidden=!open;text.textContent=s.hint;
  const screen=document.getElementById('app-screen');screen.querySelectorAll('.hint-mark').forEach(x=>x.remove());
  if(open){
    for(const t of s.targets){const mark=document.createElement('div');mark.className='hint-mark';mark.setAttribute('aria-hidden','true');locate(mark,t.rect,s);screen.append(mark);}
    if(s.type!=='scroll'){
      const control=screen.querySelector('.hotspot, input, select');control?.focus({preventScroll:true});
      if(!document.body.classList.contains('activity-open'))screen.querySelector('.hint-mark')?.scrollIntoView({block:'center',behavior:'instant'});
    }
  }
}
function fitScreen(s){
  const space=document.getElementById('screen-space'),device=document.getElementById('device');if(!space||!device)return;
  const availableWidth=Math.max(40,space.clientWidth-4),availableHeight=Math.max(40,space.clientHeight-4),aspect=s.imageWidth/s.imageHeight;
  const width=Math.min(availableWidth,(availableHeight-2)*(s.type==='scroll'?1.45:1)*aspect+2);
  const fullHeight=(width-2)/aspect+2;
  const height=s.type==='scroll'?Math.min(availableHeight,fullHeight-Math.min(100,fullHeight*.3)):fullHeight;
  device.style.width=width+'px';device.style.height=height+'px';
  const fields=[...document.querySelectorAll('.field-overlay,.saved-field')];
  document.body.classList.toggle('compact-screen',width<235||fields.some(el=>el.getBoundingClientRect().height<36));
  adaptFieldEditors(s);
}
function adaptFieldEditors(s){
  for(const f of s.fields){
    const wrap=[...document.querySelectorAll('.field-overlay')].find(el=>el.dataset.field===f.name);const input=document.getElementById('field-'+f.name);if(!wrap||!input)continue;
    const label=document.querySelector(`label[for="field-${f.name}"]`);const tiny=wrap.getBoundingClientRect().height<22;const hadFocus=document.activeElement===input;
    if(tiny&&!input.closest('.compact-field')){
      let editor=document.getElementById('compact-editor');
      if(!editor){editor=document.createElement('div');editor.id='compact-editor';editor.innerHTML='<p class="editor-label">Practice entry <small>The field is enlarged here.</small></p>';document.querySelector('.action-heading').append(editor);}
      const row=document.createElement('div');row.className='compact-field';row.dataset.field=f.name;if(label)row.append(label);row.append(input);editor.append(row);
      const tap=button(input.value||'Enter…','field-tap',()=>{input.focus({preventScroll:true});input.scrollIntoView({block:'nearest'});});tap.setAttribute('aria-label','Edit '+f.label);wrap.append(tap);if(hadFocus)input.focus({preventScroll:true});
    }else if(!tiny&&input.closest('.compact-field')){
      const row=input.closest('.compact-field');wrap.querySelector('.field-tap')?.remove();if(label)wrap.append(label);wrap.append(input);row.remove();if(hadFocus)input.focus({preventScroll:true});
    }
  }
  const editor=document.getElementById('compact-editor');if(editor&&!editor.querySelector('.compact-field'))editor.remove();
}
function showZoom(s){
  const t=s.targets.find(t=>t.name===s.zoomRegion);if(!t)return;const [x,y,w,h]=t.rect;const scale=240/Math.max(w,h);
  document.getElementById('screen-extra').innerHTML=`<figure class="zoom"><figcaption>Captured inspection photo</figcaption><div><img src="${e(imageSrc(s.image))}" alt="Enlarged captured inspection photo" style="width:${s.imageWidth*scale}px;height:${s.imageHeight*scale}px;left:${-x*scale}px;top:${-y*scale}px"></div><button type="button" class="button secondary" id="close-photo">Close photo</button></figure>`;
  document.getElementById('close-photo').addEventListener('click',event=>{event.currentTarget.closest('figure').remove();document.getElementById('continue')?.focus({preventScroll:true});});
}
function renderCompletion(){
  fitObserver?.disconnect();document.body.classList.remove('activity-open','compact-screen');
  remember();
  main.innerHTML=`<section class="completion"><div class="completion-icon" aria-hidden="true">✓</div><h1 tabindex="-1">Topic complete</h1><p>You have practised <strong>${e(topic.title.toLowerCase())}</strong>.</p><ul>${topic.sections.map(s=>'<li>'+e(s.title)+'</li>').join('')}</ul><p>You can repeat the activity whenever you need a reminder.</p><div class="completion-actions"><button type="button" class="button primary" id="retry">Practise again</button><a class="button secondary" href="?view=topics">${topics.length===1?'Topic overview':'All topics'}</a></div></section>`;
  document.getElementById('retry').addEventListener('click',()=>{state=restart(state);remember();renderStep();});main.querySelector('h1').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});
}
function setupFullscreen(){
  const root=document.documentElement;const control=document.getElementById('fullscreen-toggle');const status=document.getElementById('fullscreen-status');
  if(!control)return;
  let expanded=false;
  const active=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
  function update(){
    const label=active()?'Exit fullscreen':expanded?'Exit expanded view':'Fullscreen';
    control.setAttribute('aria-label',label);control.setAttribute('aria-pressed',String(active()||expanded));control.querySelector('span').textContent=label;
    control.title=active()?'Exit fullscreen (Escape)':expanded?'Exit expanded view (Escape)':'Enter fullscreen';
    root.classList.toggle('expanded-view',expanded);root.classList.toggle('is-fullscreen',active());
  }
  control.addEventListener('click',async()=>{
    control.disabled=true;
    try{
      if(expanded){expanded=false;status.textContent='Expanded view closed.';}
      else if(active()){
        const exit=document.exitFullscreen||document.webkitExitFullscreen;await exit.call(document);
      }else{
        const enter=root.requestFullscreen||root.webkitRequestFullscreen;
        if(!enter)throw new Error('Fullscreen unavailable');
        await enter.call(root);
      }
    }catch{
      if(active())status.textContent='Use Escape to leave fullscreen.';
      else{expanded=true;status.textContent='Expanded view enabled. Browser fullscreen is unavailable here.';}
    }finally{control.disabled=false;update();}
  });
  document.addEventListener('fullscreenchange',update);document.addEventListener('webkitfullscreenchange',update);
  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&expanded){expanded=false;update();status.textContent='Expanded view closed.';}});
  update();
}
setupFullscreen();
if(topic)startTopic();else renderHub();

})();

</script>
